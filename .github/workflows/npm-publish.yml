name: Publish npm packages

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish-platforms:
    name: Publish ${{ matrix.platform }}
    # Release is tag-triggered; resolve the tag from the completed run SHA.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            artifact_suffix: aarch64-apple-darwin.tar.gz
            binary: cc-audit
          - platform: darwin-x64
            artifact_suffix: x86_64-apple-darwin.tar.gz
            binary: cc-audit
          - platform: linux-arm64
            artifact_suffix: aarch64-unknown-linux-gnu.tar.gz
            binary: cc-audit
          - platform: linux-x64
            artifact_suffix: x86_64-unknown-linux-gnu.tar.gz
            binary: cc-audit
          - platform: linux-x64-musl
            artifact_suffix: x86_64-unknown-linux-musl.tar.gz
            binary: cc-audit
          - platform: win32-x64
            artifact_suffix: x86_64-pc-windows-msvc.zip
            binary: cc-audit.exe

    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        id: release
        run: |
          TAG=$(bash .github/scripts/resolve-release-tag.sh "$HEAD_SHA" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git")
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}


      - name: Verify GitHub release
        run: |
          test "$(gh release view "${{ steps.release.outputs.tag }}" --json tagName --jq .tagName)" = "${{ steps.release.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm publisher identity and package access
        run: |
          NPM_USER=$(npm whoami --registry=https://registry.npmjs.org)
          test -n "$NPM_USER"
          echo "npm authentication succeeded for user $NPM_USER"
          npm view @cc-audit/linux-x64 name version --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Download release artifact
        run: |
          ARTIFACT="cc-audit-${{ steps.release.outputs.tag }}-${{ matrix.artifact_suffix }}"
          gh release download "${{ steps.release.outputs.tag }}" \
            --pattern "$ARTIFACT" \
            --dir ./tmp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binary
        run: |
          mkdir -p npm/${{ matrix.platform }}/bin
          cd tmp
          if [[ "${{ matrix.artifact_suffix }}" == *.zip ]]; then
            unzip *.zip
          else
            tar -xzf *.tar.gz
          fi
          mv ${{ matrix.binary }} ../npm/${{ matrix.platform }}/bin/
          chmod +x ../npm/${{ matrix.platform }}/bin/* || true

      - name: Update version in package.json
        run: |
          VERSION="${{ steps.release.outputs.tag }}"
          VERSION="${VERSION#v}"
          cd npm/${{ matrix.platform }}
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json
          mv tmp.json package.json

      - name: Publish platform package
        run: |
          cd npm/${{ matrix.platform }}
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-main:
    name: Publish main package
    needs: publish-platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update version in package.json
        run: |
          VERSION="${{ needs.publish-platforms.outputs.tag }}"
          VERSION="${VERSION#v}"
          cd npm/cc-audit
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json
          mv tmp.json package.json
          jq --arg v "$VERSION" '.optionalDependencies |= with_entries(.value = $v)' package.json > tmp.json
          mv tmp.json package.json

      - name: Publish main package
        run: |
          cd npm/cc-audit
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
